[build]
  command = "npm run build"
  publish = "."

[context.production.environment]
  NODE_VERSION = "20"

# Handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never remove HTML extension
[[redirects]]
  from = "/:file.html"
  to = "/:file.html"
  status = 200

# Cache assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/*"
  [headers.values]

    Cache-Control = "public, max-age=31536000, immutable"
